<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#15803d" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1512" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HVAC Assistant">
<title>HVAC Assistant</title>
<link rel="manifest" href="/app/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" type="image/png" href="/app/icon-192.png">
<link rel="apple-touch-icon" href="/app/icon-192.png">
<link rel="stylesheet" href="/app/styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <img class="logo" src="/app/icon-192.png" alt="" width="40" height="40">
    <div class="titles">
      <h1>HVAC Assistant</h1>
      <p>Catalogues, datasheets and manuals</p>
    </div>
    <button type="button" id="saved" class="icon-btn" aria-label="Saved work" title="Saved work">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </button>
  </header>

  <main id="messages" role="log" aria-live="polite" aria-label="Conversation"></main>
  <button type="button" id="jump" class="jump" hidden>New messages &#8595;</button>

  <div id="banner" class="banner" role="status" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <form id="composer" class="composer" autocomplete="off">
    <input type="file" id="file" accept="image/*,application/pdf,.xlsx,.xls,.csv" hidden>
    <button type="button" id="attach" class="icon-btn" aria-label="Attach a photo or file" title="Attach a photo or file">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7-7l8.8-8.8a3.3 3.3 0 0 1 4.7 4.7l-8.8 8.8a1.7 1.7 0 0 1-2.4-2.4l8.1-8.1"/></svg>
    </button>
    <textarea id="text" rows="1" placeholder="Message" aria-label="Message" enterkeyhint="send" autocapitalize="sentences" maxlength="4000"></textarea>
    <button type="submit" id="send" class="send-btn" aria-label="Send" title="Send">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="currentColor"><path d="M3.4 20.4l17.5-7.9a.6.6 0 0 0 0-1.1L3.4 3.6a.6.6 0 0 0-.9.7L4.6 11l9 1-9 1-2.1 6.7a.6.6 0 0 0 .9.7z"/></svg>
    </button>
  </form>

  <div id="gate" class="gate" hidden>
    <div class="gate-card">
      <img src="/app/icon-192.png" alt="" width="56" height="56">
      <h2>HVAC Assistant</h2>
      <p id="gate-msg"></p>
    </div>
  </div>
</div>
<script src="/app/render.js"></script>
<script src="/app/app.js"></script>
</body>
</html>
